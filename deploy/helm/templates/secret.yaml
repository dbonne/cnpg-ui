{{- /*
  cnpg-ui-credentials Secret
  
  This Secret holds the admin credentials for the CNPG Web UI.
  The password is stored as a bcrypt hash (cost 12) — never in plaintext.
  
  Behaviour:
    - If the Secret already exists in the cluster (e.g. upgraded from a previous
      release), Helm will NOT overwrite it because lookup() returns the existing
      object and we skip rendering. This preserves any password changes made at
      runtime via the /api/v1/auth/password endpoint.
    - If the Secret does NOT exist (first install), we generate a random initial
      admin password using Helm's randAlphaNum function and store its bcrypt hash.
      The plaintext password is written to an annotation on the Secret so the
      operator can retrieve it once (e.g. via `kubectl get secret`) and then
      rotate it.
  
  Security notes:
    - httpOnly, Secure, SameSite=Strict session cookies are enforced at the
      application layer (not configurable here).
    - Rotate the password immediately after first login using the UI or the API.
*/ -}}

{{- /*
  cnpg-ui-credentials Secret

  This Secret holds the admin credentials for the CNPG Web UI.
  The password is stored as a bcrypt hash (cost 12) — never in plaintext.

  Behaviour:
    - If the Secret already exists in the cluster (e.g. upgraded from a previous
      release), Helm will NOT overwrite it because lookup() returns the existing
      object and we skip rendering. This preserves any password changes made at
      runtime via the /api/v1/auth/password endpoint.
    - If the Secret does NOT exist (first install), we generate a random initial
      admin password using Helm's randAlphaNum function and store its bcrypt hash.
      The plaintext password is printed once in NOTES.txt at install time only
      and is NOT stored anywhere in the cluster.

  Security notes:
    - The plaintext password is never written to any Kubernetes resource.
    - httpOnly, Secure, SameSite=Strict session cookies are enforced at the
      application layer (not configurable here).
    - Rotate the password immediately after first login using the UI or the API.
*/ -}}

{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "cnpg-ui.credentialsSecretName" .) -}}
{{- if not $existing -}}
{{- $plainPassword := randAlphaNum 24 -}}
{{- $bcryptHash := $plainPassword | bcrypt -}}
{{- /* Store the generated password in Values so NOTES.txt can print it. */ -}}
{{- $_ := set .Values "__generatedPassword" $plainPassword -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cnpg-ui.credentialsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cnpg-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.adminUsername | default "admin" | quote }}
  {{- /*
    password_hash stores the bcrypt hash of the initial password.
    The application reads this key (not 'password') so the plaintext
    never lives in cluster state.
  */ -}}
  password_hash: {{ $bcryptHash | quote }}
{{- end -}}
