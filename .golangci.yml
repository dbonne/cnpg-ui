version: "2"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - exhaustive
    - godot
    - noctx
    - bodyclose
    - gocritic

  settings:
    goimports:
      local-prefixes: github.com/dbonne/cnpg-ui

    revive:
      rules:
        - name: exported
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"

    exhaustive:
      default-signifies-exhaustive: true

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance

  exclusions:
    generated: lax
    rules:
      - path: ".*\\.gen\\.go"
        linters:
          - errcheck
          - govet
          - exhaustive
          - unused
          - revive

      - path: "_test\\.go"
        linters:
          - gocritic
          - godot

run:
  timeout: 5m
  tests: true
